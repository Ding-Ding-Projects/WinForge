name: Managed build & release · .NET 建置同發佈

# This workflow builds, packages, and publishes. It deliberately does not run
# tests, lint, type checks, accessibility checks, or screenshot checks: those
# remain local developer/agent checks and never gate a release.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit to build; defaults to the selected ref
        required: false
        type: string
      release_version:
        description: Numeric 1.1.x version; defaults to the workflow run number
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: managed-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Resolve immutable source · 確定不變原始碼
        id: source
        shell: pwsh
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'Ding-Ding-Projects/WinForge') {
            throw "managed releases are restricted to Ding-Ding-Projects/WinForge: $env:GITHUB_REPOSITORY"
          }
          $sha = ([string]$env:REQUESTED_SHA).Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($sha)) { $sha = ([string]$env:EVENT_SHA).Trim().ToLowerInvariant() }
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "source_sha must be a full 40-character commit SHA: $sha" }
          $version = ([string]$env:REQUESTED_VERSION).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.1.$env:GITHUB_RUN_NUMBER" }
          if ($version -notmatch '^1\.1\.[0-9]+$') { throw "release_version must match 1.1.<integer>: $version" }
          $build = [int]$version.Split('.')[2]
          if ($build -lt 1 -or $build -gt 65535) { throw "release_version build component must fit a Windows FileVersion: $build" }
          "sha=$sha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout exact source · 取出指定原始碼
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.source.outputs.sha }}

      - name: Verify checkout provenance · 驗證取出來源
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) { throw "checkout provenance mismatch: expected $env:EXPECTED_SHA, got $actual" }

      - name: Set up .NET 8 · 安裝 .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up .NET 11 preview · 安裝 .NET 11 預覽版
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build and package Squirrel.Windows release · 建置 Squirrel.Windows 發佈
        shell: pwsh
        env:
          WINFORGE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          # The helper invokes Squirrel.Windows with --releasify and --no-msi; MSI and signing are intentionally absent.
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build-winforge.ps1 -Installer -Silent -Version $env:WINFORGE_VERSION -ReleaseDir "$PWD\release-artifacts"
          if ($LASTEXITCODE -ne 0) { throw 'Squirrel.Windows build or packaging failed' }

      - name: Verify packaged provenance manifest · 驗證 package provenance 清單
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
        run: |
          $manifest = Join-Path $PWD 'artifacts\winforge\publish\WinForge.release.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'WinForge.release.json was not packaged' }
          $record = Get-Content -Raw -LiteralPath $manifest | ConvertFrom-Json
          if ($record.sourceSha -ne $env:EXPECTED_SHA -or $record.version -ne $env:EXPECTED_VERSION -or $record.installerAsset -ne 'Setup.exe') {
            throw 'WinForge.release.json provenance does not match the requested source or Squirrel installer'
          }
          $app = Get-Item -LiteralPath (Join-Path $PWD 'artifacts\winforge\publish\WinForge.exe')
          if (-not $app.VersionInfo.ProductVersion.Trim().StartsWith($env:EXPECTED_VERSION, [StringComparison]::OrdinalIgnoreCase)) { throw "ProductVersion.Trim() mismatch: $($app.VersionInfo.ProductVersion)" }

      - name: Count tracked lines · 統計 tracked 程式碼行數
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/count-lines.ps1 | Tee-Object -FilePath release-artifacts\line-count.md
          if ($LASTEXITCODE -ne 0) { throw 'line counter failed' }

      - name: Resolve verified dim-sum release code name · 解析已驗證點心代號
        id: dimsum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $catalog = Invoke-RestMethod -UseBasicParsing 'https://raw.githubusercontent.com/Ding-Ding-Projects/dim-sum-photos/main/catalog/index.json'
          $published = @(& gh api repos/Ding-Ding-Projects/dim-sum-photos/releases/tags/catalog-v1 --jq '.assets[].name')
          $existing = @(& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json)
          $used = [System.Collections.Generic.List[string]]::new()
          foreach ($item in $existing) {
            try { $body = ((gh release view $item.tagName --repo $env:GITHUB_REPOSITORY --json body | ConvertFrom-Json).body); if ($body) { $used.Add([string]$body) } } catch { }
          }
          $selected = $null
          foreach ($dish in @($catalog.dishes)) {
            $file = [IO.Path]::GetFileName([string]$dish.image.path)
            $code = "$($dish.name.en) · $($dish.name.zhHant)"
            if ($published -contains $file -and -not (($used -join "`n") -match [regex]::Escape($code))) { $selected = [pscustomobject]@{ Code=$code; File=$file; Url="https://github.com/Ding-Ding-Projects/dim-sum-photos/releases/download/catalog-v1/$file"; En=$dish.name.en; Zh=$dish.name.zhHant }; break }
          }
          if (-not $selected) { Write-Warning 'No unused published dim-sum photo was available; release will use version-only metadata.'; $selected = [pscustomobject]@{ Code=''; File=''; Url=''; En=''; Zh='' } }
          "code=$($selected.Code)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file=$($selected.File)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "url=$($selected.Url)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish exactly one verified release · 發佈一個已驗證版本
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          EVENT_REF: ${{ github.ref }}
          DISH_CODE: ${{ steps.dimsum.outputs.code }}
          DISH_FILE: ${{ steps.dimsum.outputs.file }}
          DISH_URL: ${{ steps.dimsum.outputs.url }}
        run: |
          $expectedSha = ([string]$env:EXPECTED_SHA).Trim().ToLowerInvariant()
          $tag = [string]$env:RELEASE_TAG
          $artifactDir = (Resolve-Path -LiteralPath 'release-artifacts').Path
          $assets = @(Get-ChildItem -LiteralPath $artifactDir -File | Where-Object { $_.Name -in @('Setup.exe','RELEASES') -or $_.Name -like 'WinForge-*-full.nupkg' -or $_.Name -like 'WinForge-*-delta.nupkg' -or $_.Name -like 'WinForge-portable-x64-*.zip' })
          $required = @('Setup.exe','RELEASES',"WinForge-$env:RELEASE_VERSION-full.nupkg", "WinForge-portable-x64-$env:RELEASE_VERSION.zip")
          foreach ($name in $required) { if (-not ($assets.Name -contains $name)) { throw "release artifact is missing: $name" } }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'could not refresh origin/main before publication' }
          $remoteMain = (git rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          $stable = $env:EVENT_REF -eq 'refs/heads/main' -and $expectedSha -eq $remoteMain
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "managed release tag already exists and is immutable: $tag" }

          $lineCount = [IO.File]::ReadAllText((Join-Path $artifactDir 'line-count.md')).Trim()
          $started = [DateTimeOffset]::Parse((& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --jq '.run_started_at').Trim())
          $notesPath = Join-Path $artifactDir 'release-notes.md'
          $notes = @"
          Automated Squirrel.Windows release from commit $expectedSha.
          由 commit $expectedSha 建置嘅 Squirrel.Windows 版本。

          ## Installer and update assets
          - Setup.exe — Squirrel.Windows unsigned installer. It may trigger an unknown-publisher or SmartScreen warning.
          - RELEASES — Squirrel.Windows update index.
          - WinForge-$env:RELEASE_VERSION-full.nupkg — full Squirrel.Windows package.
          - WinForge-portable-x64-$env:RELEASE_VERSION.zip — portable build.
          - Delta packages are attached when a prior Squirrel release is available to the packaging step.

          ## Verification
          - GitHub Actions ran build, publish, packaging, artifact, digest, and provenance checks only; it did not run tests or lint.
          - Workflow started: $($started.UtcDateTime.ToString('o'))
          - Workflow completed: recorded immediately after release publication.
          - Workflow duration: recorded immediately after release publication.
          - Source commit: $expectedSha
          - Unsigned artifacts: code signing is permanently disabled.

          ## Line count at this commit
          $lineCount
          "@
          if ($env:DISH_CODE) { $notes += "`n## Dim-sum release code name`n- $env:DISH_CODE — [$env:DISH_FILE]($env:DISH_URL)`n" }
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))

          $create = @('release','create',$tag) + @($assets.FullName) + @('--repo',$env:GITHUB_REPOSITORY,'--target',$expectedSha,'--title',"WinForge $tag",'--notes-file',$notesPath)
          if ($stable) { $create += '--latest' } else { $create += '--prerelease' }
          gh @create
          if ($LASTEXITCODE -ne 0) { throw "managed release creation failed: $tag" }

          $completed = [DateTimeOffset]::UtcNow
          $duration = $completed - $started
          $durationText = '{0:hh\:mm\:ss}' -f $duration
          $finalNotes = $notes -replace 'Workflow completed: recorded immediately after release publication\.', "Workflow completed: $($completed.UtcDateTime.ToString('o'))" -replace 'Workflow duration: recorded immediately after release publication\.', "Workflow duration: $durationText"
          [IO.File]::WriteAllText($notesPath, $finalNotes, [Text.UTF8Encoding]::new($false))
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "managed release notes update failed: $tag" }

          $release = (gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json)
          if ($release.draft -or ([bool]$release.prerelease -eq $stable)) { throw 'release channel or draft state is wrong' }
          $expectedNames = @($assets.Name | Sort-Object)
          $actualNames = @($release.assets | ForEach-Object { [string]$_.name } | Sort-Object)
          $expectedAssetText = [string]::Join("`n", $expectedNames)
          $actualAssetText = [string]::Join("`n", $actualNames)
          if ($expectedAssetText -ne $actualAssetText) { throw "release asset set mismatch: $($actualNames -join ', ')" }
          foreach ($asset in @($release.assets)) {
            $local = Join-Path $artifactDir $asset.name
            $digest = (Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([string]$asset.digest -ne "sha256:$digest") { throw "managed release digest mismatch for $($asset.name)" }
            $expectedUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($asset.name)"
            if ([string]$asset.browser_download_url -ne $expectedUrl) { throw "managed release download URL mismatch for $($asset.name)" }
          }
          $tagRef = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" | ConvertFrom-Json)
          $target = ([string]$tagRef.object.sha).ToLowerInvariant()
          if ([string]$tagRef.object.type -eq 'tag') {
            $target = ((gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$target" --jq '.object.sha').Trim()).ToLowerInvariant()
          }
          if ($target -ne $expectedSha) { throw "release target mismatch: expected $expectedSha, got $target" }
          Write-Host "Verified managed Squirrel.Windows release $tag -> $expectedSha (stable=$stable; assets=$($actualNames.Count))"

      - name: Collect safe release evidence · 收集安全發佈證據
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-evidence | Out-Null
          git rev-parse HEAD | Out-File ci-evidence\commit.txt -Encoding utf8
          Get-Date -AsUTC -Format o | Out-File ci-evidence\collected-at.txt -Encoding utf8
          if (Test-Path -LiteralPath release-artifacts) { Copy-Item -LiteralPath release-artifacts -Destination ci-evidence\release-artifacts -Recurse -Force }

      - name: Upload safe release evidence · 上載安全發佈證據
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: winforge-release-evidence-${{ github.run_id }}
          path: ci-evidence
          if-no-files-found: warn
          retention-days: 7
